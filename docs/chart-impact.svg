<svg xmlns="http://www.w3.org/2000/svg" width="840" height="210" viewBox="0 0 840 210" role="img" aria-label="Impact of the length rule"><rect width="840" height="210" fill="#ffffff" rx="8"/><text x="26" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#14181c" font-weight="700" text-anchor="start">A one-line rule removes 91% of it</text><text x="26" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5d666e" font-weight="400" text-anchor="start">Ordinary English words still censored, before and after “entries under five characters match only as whole words”</text><text x="138" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#14181c" font-weight="600" text-anchor="end">before</text><rect x="150" y="84" width="560" height="32" fill="#eef1f4" rx="3"/><rect x="150" y="84" width="560" height="32" fill="#c0392b" rx="3"/><text x="700" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" font-weight="700" text-anchor="end">8,414</text><text x="138" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#14181c" font-weight="600" text-anchor="end">after</text><rect x="150" y="136" width="560" height="32" fill="#eef1f4" rx="3"/><rect x="150" y="136" width="49" height="32" fill="#14181c" rx="3"/><text x="209" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#14181c" font-weight="700" text-anchor="start">739</text><text x="150" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5d666e" font-weight="400" text-anchor="start">7,675 words recovered — no entry removed from the block list</text></svg>